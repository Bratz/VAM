server:
  port: 8091

spring:
  application:
    name: file-ingest-agent-service
  # Still a headless worker with no customer-facing HTTP (see tasks/file-ingest-pipeline-design.md's
  # "Revised architecture") -- the one @RestController that exists (JiraWebhookController) is an
  # internal wake-up ping from Jira itself, not a customer-facing endpoint, and isn't routed
  # publicly except through Caddy's /webhooks/jira path with its own shared secret.
  datasource:
    # Same Postgres instance/database the main backend uses. Unlike before, this service no
    # longer owns its own schema — it's a second JPA client of backend's `public` schema
    # (ingest_job/format_signature/timeline_event), which backend's own Flyway/ddl-auto manages.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vam_db}
    username: ${SPRING_DATASOURCE_USERNAME:vam_user}
    password: ${DB_PASSWORD:vam_user123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate   # schema owned by backend's own migrations/ddl-auto now, not this service
  flyway:
    enabled: false   # this service no longer owns any schema

ingest:
  jira:
    base-url: ${JIRA_BASE_URL:https://vam-five.atlassian.net}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    project-key: ${JIRA_PROJECT_KEY:KAN}
    # Shared secret for Jira's own "Issue Created" webhook (see JiraWebhookController) -- Jira
    # Cloud's classic WebHooks feature has no HMAC signing like GitHub's, so this is checked as a
    # query param on the webhook URL itself instead. Blank disables the endpoint (always 401s).
    webhook-secret: ${JIRA_WEBHOOK_SECRET:}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  agent:
    max-turns: ${AGENT_MAX_TURNS:10}
    max-retries: ${AGENT_MAX_RETRIES:1}
  # Must match backend's vam.fileingest.workspace-dir exactly — the shared filesystem (uploaded
  # source files, the transform-handlers checkout) is one of only two things connecting the two
  # services, the other being the shared Jira project.
  workspace-dir: ${INGEST_WORKSPACE_DIR:/data/file-ingest-workspace}

# Sentry error monitoring — SDK auto-disables itself when dsn is blank, same as backend's.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0

logging:
  level:
    com.bank.vam.fileingest: DEBUG
