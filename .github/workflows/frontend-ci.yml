# ============================================================================
# Frontend detector for the automated defect-fix pipeline
# (see tasks/defect-autofix-pipeline-design.md).
#
# Runs type-check + lint on every PR and on every push to main, and uploads
# structured, commit-tagged output as artifacts. The defect-fix service (not
# this workflow) decides what's a "new" failure: it diffs a PR's HEAD
# artifact against the artifact for the PR's merge-base commit, so today's
# pre-existing warnings never get auto-ticketed — only regressions do.
#
# This workflow's own pass/fail status still reflects reality (it is NOT
# forced green) — it's a normal CI signal for humans; the diffing/ticketing
# decision lives entirely in the service.
# ============================================================================
name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [main]
    # No paths filter here (unlike pull_request above): every commit on main
    # needs its own baseline artifact so the defect-fix service can always
    # find one to diff a PR's merge-base against, even if that particular
    # commit didn't touch frontend/**.

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check (captured, non-blocking)
        run: npm run type-check > tsc.log 2>&1; echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        id: typecheck
        continue-on-error: true

      - name: Lint (captured as JSON, non-blocking)
        run: npx eslint . --ext ts,tsx --format json --output-file eslint.json; echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        id: lint
        continue-on-error: true

      - name: Upload results for this commit
        uses: actions/upload-artifact@v4
        with:
          # Not github.sha: for a pull_request-triggered run, github.sha is a
          # synthetic merge commit, not the branch's real head commit — the
          # defect-fix service looks artifacts up by workflow_run.head_sha
          # (the real one), so naming with github.sha here would make every
          # PR-triggered artifact unfindable. github.event.pull_request.head.sha
          # is only set on pull_request events, so this falls back to the
          # (correct, real) github.sha on a plain push to main.
          name: frontend-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/tsc.log
            frontend/eslint.json
          retention-days: 14

      - name: Fail the job if either check actually failed
        run: |
          if [ "${{ steps.typecheck.outputs.exit_code }}" != "0" ] || [ "${{ steps.lint.outputs.exit_code }}" != "0" ]; then
            echo "type-check or lint failed — see tsc.log / eslint.json artifact"
            exit 1
          fi
