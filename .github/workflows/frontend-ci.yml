# ============================================================================
# Frontend detector for the automated defect-fix pipeline
# (see tasks/defect-autofix-pipeline-design.md).
#
# Runs type-check + lint on every PR and on every push to main, and uploads
# structured, commit-tagged output as artifacts. The defect-fix service (not
# this workflow) decides what's a "new" failure: it diffs a PR's HEAD
# artifact against the artifact for the PR's merge-base commit, so today's
# pre-existing warnings never get auto-ticketed — only regressions do.
#
# This workflow's own pass/fail status still reflects reality (it is NOT
# forced green) — it's a normal CI signal for humans; the diffing/ticketing
# decision lives entirely in the service.
# ============================================================================
name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [main]
    # No paths filter here (unlike pull_request above): every commit on main
    # needs its own baseline artifact so the defect-fix service can always
    # find one to diff a PR's merge-base against, even if that particular
    # commit didn't touch frontend/**.

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check (captured, non-blocking)
        # set +e: each step's script runs under `bash -e` by default, so
        # without this, a non-zero exit from `npm run type-check` aborts the
        # script right there — the exit_code line below would never run, and
        # steps.typecheck.outputs.exit_code would stay unset (not "0", but
        # not the real code either) instead of accurately reflecting failure.
        run: |
          set +e
          npm run type-check > tsc.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        id: typecheck
        continue-on-error: true

      - name: Lint (captured as JSON, non-blocking)
        # --max-warnings 0 matches this repo's own `npm run lint` script —
        # without it, a file with only warnings (no errors) exits 0 on its
        # own merits, same as the project's real "clean lint" bar.
        run: |
          set +e
          npx eslint . --ext ts,tsx --max-warnings 0 --format json --output-file eslint.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        id: lint
        continue-on-error: true

      - name: Model checks (captured, non-blocking)
        # scenarioModel's removeShadow cascade: deleting a shadow has to take
        # the rules and pools that referenced it, or the scenario is left
        # holding dangling localIds. That breaks silently — the tree still
        # renders, the numbers are just wrong — so it is worth a gate. Plain
        # node + assert over esbuild; no test runner in this project.
        run: |
          set +e
          npm run model:check > model-check.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        id: modelcheck
        continue-on-error: true

      - name: Upload results for this commit
        uses: actions/upload-artifact@v5
        with:
          # Not github.sha: for a pull_request-triggered run, github.sha is a
          # synthetic merge commit, not the branch's real head commit — the
          # defect-fix service looks artifacts up by workflow_run.head_sha
          # (the real one), so naming with github.sha here would make every
          # PR-triggered artifact unfindable. github.event.pull_request.head.sha
          # is only set on pull_request events, so this falls back to the
          # (correct, real) github.sha on a plain push to main.
          name: frontend-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/tsc.log
            frontend/eslint.json
            frontend/model-check.log
          retention-days: 14

      - name: Fail the job if any check actually failed
        run: |
          if [ "${{ steps.typecheck.outputs.exit_code }}" != "0" ]             || [ "${{ steps.lint.outputs.exit_code }}" != "0" ]             || [ "${{ steps.modelcheck.outputs.exit_code }}" != "0" ]; then
            echo "type-check, lint or model check failed — see tsc.log / eslint.json / model-check.log artifact"
            exit 1
          fi

  # Storybook is the design-system specimen: every story must build and render, in light and dark.
  # Render failures fail the job — genuinely so since the PIPESTATUS fix below; before it the
  # result was piped into tee and the job passed regardless. WCAG contrast findings are
  # reported (report-only) until the baseline is clean; set STORYBOOK_A11Y_STRICT=1 to fail on them.
  storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook -- -o storybook-static

      - name: Install Chromium for the render check
        run: npx playwright install --with-deps chromium

      - name: Render + contrast check (captured, non-blocking)
        # `| tee` used to swallow the result: steps run under `bash -e` with no
        # pipefail, so the pipeline exited with tee's status (always 0) and a
        # render failure passed the job — despite the comment above saying
        # otherwise. PIPESTATUS[0] is the real code, and it has to be read on
        # the very next line before anything else overwrites it. tee stays so
        # the output still streams live during a slow render pass.
        run: |
          set +e
          npm run storybook:check 2>&1 | tee storybook-check.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        id: storybookcheck
        continue-on-error: true

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: storybook-check-${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend/storybook-check.log
          retention-days: 14

      - name: Fail the job if the render check actually failed
        run: |
          if [ "${{ steps.storybookcheck.outputs.exit_code }}" != "0" ]; then
            echo "storybook render/contrast check failed — see storybook-check.log artifact"
            exit 1
          fi
