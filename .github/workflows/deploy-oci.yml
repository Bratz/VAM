# ============================================================================
# Auto-deploy to the OCI VM on every push to main — the "push to deploy"
# feature managed platforms give you for free, rebuilt for self-hosting.
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   VM_HOST      the VM's public IP
#   VM_USER      ubuntu
#   VM_SSH_KEY   the PRIVATE key matching the VM's authorized key
#
# The VM must already have the repo cloned at ~/VAM and deploy/oci/.env
# created (see docs/DEPLOYMENT.md).
#
# --profile mcp --profile defectfix --profile fileingest are passed explicitly below:
# Compose only manages a profile-scoped service (mcp-gateway, defect-fix-service,
# file-ingest-agent-service, caddy) when its profile is active for the invocation,
# and does NOT stop or rebuild an already-running out-of-profile container either —
# so a plain `up` here would silently leave those running their OLD image forever,
# even though `git pull` did fetch the new code. If you stop using one of these
# profiles on the VM, remove its --profile flag here too, or this workflow will
# keep redeploying it on every push regardless.
# ============================================================================
name: Deploy to OCI VM

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/VAM
            git pull origin main
            cd deploy/oci
            sudo docker compose --profile mcp --profile defectfix --profile fileingest up -d --build
            sudo docker image prune -f
            # BuildKit cache isn't touched by image prune and grows unbounded
            # across rebuilds (hit 19GB and filled the VM's 45GB disk) — keep
            # a 48h window so incremental builds stay fast without piling up.
            sudo docker builder prune -af --filter until=48h
