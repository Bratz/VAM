server:
  port: 8090

pipeline:
  jira:
    base-url: ${JIRA_BASE_URL:https://vam-five.atlassian.net}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    project-key: ${JIRA_PROJECT_KEY:KAN}
  github:
    owner: ${GITHUB_OWNER:Bratz}
    repo: ${GITHUB_REPO:VAM}
    token: ${GITHUB_TOKEN:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  agent:
    workspace-dir: ${AGENT_WORKSPACE_DIR:/data/defect-fix-workspace}
    max-turns: ${AGENT_MAX_TURNS:20}
    max-retries: ${AGENT_MAX_RETRIES:2}

logging:
  level:
    com.bank.vam.defectfix: DEBUG
