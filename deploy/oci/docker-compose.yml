# ============================================================================
# vam-portal on an Oracle Cloud Always-Free VM (Ampere A1, Ubuntu).
#
#   sudo docker compose up -d --build
#
# Runs Postgres + the self-seeding backend (root Dockerfile) + the MCP
# gateway (mcp-gateway/Dockerfile) + Caddy, terminating real HTTPS in front of
# the gateway (see deploy/oci/Caddyfile) — the OAuth 2.1 trust boundary in
# front of the backend's /mcp endpoint (see docs/mcp-architecture.md). First
# boot with SEED_ON_START=true loads the repo's demo dump into the fresh
# database. The frontend is NOT here — it deploys to Vercel and reaches this
# VM via a server-side rewrite (see docs/DEPLOYMENT.md).
# ============================================================================

# Secrets come from an untracked `.env` file NEXT TO THIS FILE on the VM
# (compose reads it automatically). Keeping the tracked file clean means
# `git pull` during auto-deploy never conflicts:
#
#   echo 'VAM_DB_PASSWORD=<strong-password>' > deploy/oci/.env
#
# The MCP gateway is entirely opt-in — plain `docker compose up -d` never
# starts it and never touches the backend's MCP endpoint. To turn it on:
#
#   echo 'VAM_MCP_ENABLED=true' >> deploy/oci/.env
#   echo 'GATEWAY_PUBLIC_BASE_URL=https://<ip-with-dashes>.sslip.io' >> deploy/oci/.env
#   sudo docker compose --profile mcp up -d --build
#
# GATEWAY_PUBLIC_BASE_URL must be real HTTPS reachable from the outside —
# Claude's connector flow is a browser redirect from https://claude.ai and
# won't complete against plain HTTP or localhost. sslip.io's free wildcard
# DNS (e.g. https://161-33-9-182.sslip.io for that literal IP) needs no
# registration; Caddy then gets it a real Let's Encrypt cert automatically.
# The gateway itself is no longer directly published (no more "9443:9443"
# below) — Caddy on 80/443 is the only public entry point now. See
# docs/DEPLOYMENT.md "Part 1.5 — MCP gateway" for the firewall steps.
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vam_db
      POSTGRES_USER: vam_user
      POSTGRES_PASSWORD: ${VAM_DB_PASSWORD:?create deploy/oci/.env with VAM_DB_PASSWORD=...}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vam_user -d vam_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Repo root is the build context — uses the root Dockerfile.
      context: ../..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vam_db
      SPRING_DATASOURCE_USERNAME: vam_user
      DB_PASSWORD: ${VAM_DB_PASSWORD:?create deploy/oci/.env with VAM_DB_PASSWORD=...}
      SEED_ON_START: "true"   # idempotent — safe to leave on
      VAM_MARKET_PROFILE: UK
      VAM_HOME_BANK_BIC: HBUKGB4BXXX
      # MCP off by default; both flags flip together — a signed context is
      # only meaningful once something is actually minting one (the gateway).
      VAM_MCP_ENABLED: ${VAM_MCP_ENABLED:-false}
      VAM_MCP_REQUIRE_SIGNED_CONTEXT: ${VAM_MCP_ENABLED:-false}
      # Internal docker-network address — the gateway container, not the
      # public URL. Only this backend and the gateway ever talk over it.
      VAM_MCP_GATEWAY_JWKS_URI: http://mcp-gateway:9443/context-jwks
      # On a 1GB AMD micro (see DEPLOYMENT.md "1GB fallback"), uncomment to
      # cap the heap below the container-percentage default:
      # JAVA_OPTS: "-Xmx640m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
    ports:
      - "8053:8053"

  mcp-gateway:
    build:
      context: ../..
      dockerfile: mcp-gateway/Dockerfile
    restart: unless-stopped
    profiles: ["mcp"]   # `docker compose --profile mcp up -d` — opt-in, off by default
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vam_db
      SPRING_DATASOURCE_USERNAME: vam_user
      DB_PASSWORD: ${VAM_DB_PASSWORD:?create deploy/oci/.env with VAM_DB_PASSWORD=...}
      # Public-facing — must match what external clients actually reach (see
      # the .env note above). Internal calls to the backend use the docker
      # network instead, never this URL.
      #
      # NOT `:?required` — Compose interpolates every service's `environment:`
      # block while parsing the file, before `profiles:` decides what actually
      # starts. A required-and-missing var here would abort `docker compose up`
      # for EVERY service (db, backend included), even on a plain, unprofiled
      # deploy that never touches this one — which is exactly how this broke
      # the routine auto-deploy the first time. Falling back to localhost is
      # safe: with the `mcp` profile inactive this container never starts, and
      # if someone runs `--profile mcp` without setting the real value, the
      # gateway comes up but is unusable externally — a visible, non-fatal
      # misconfiguration instead of a stack-wide outage.
      GATEWAY_ISSUER: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:9443}
      GATEWAY_DEMO_REDIRECT_URI: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:9443}/authorized
      BACKEND_MCP_URL: http://backend:8053/mcp
    # No public port mapping — Caddy is the only external entry point now
    # (see the caddy service below). Still reachable from other containers
    # on the compose network at mcp-gateway:9443 (the backend's
    # VAM_MCP_GATEWAY_JWKS_URI above, and Caddy's reverse_proxy target, both
    # rely on that).
    expose:
      - "9443"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["mcp"]   # only meaningful once the gateway itself is enabled
    depends_on:
      - mcp-gateway
    ports:
      - "80:80"    # Let's Encrypt HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists the issued cert — don't lose this, or
      - caddy_config:/config   # every restart re-requests one (rate limits)

volumes:
  pgdata:
  caddy_data:
  caddy_config:
