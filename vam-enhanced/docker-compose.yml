version: '3.8'

# ==========================================
# VAM Portal - Docker Compose Configuration
# ==========================================
# Run: docker-compose up --build
# ==========================================

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: vam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vam_db
      POSTGRES_USER: vam_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vam_secure_password_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./database/seed:/docker-entrypoint-initdb.d/seed:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vam_user -d vam_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vam-network

  # ==========================================
  # Redis Cache (Optional)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: vam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vam-network

  # ==========================================
  # Spring Boot Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vam-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Database
      DATABASE_URL: jdbc:postgresql://postgres:5432/vam_db
      DATABASE_USERNAME: vam_user
      DATABASE_PASSWORD: ${DB_PASSWORD:-vam_secure_password_123}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-make-it-very-long}
      # BaNCS (mock for development)
      BANCS_API_URL: http://bancs-stub:8090
      BANCS_SYNC_ENABLED: "false"
      # JVM Options
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - vam-network

  # ==========================================
  # React Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: vam-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vam-network

  # ==========================================
  # BaNCS Stub (Mock Service for Development)
  # ==========================================
  bancs-stub:
    image: wiremock/wiremock:3.3.1
    container_name: vam-bancs-stub
    restart: unless-stopped
    command: --port 8090 --verbose
    ports:
      - "${BANCS_PORT:-8090}:8090"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    networks:
      - vam-network

  # ==========================================
  # Adminer (Database Admin - Optional)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: vam-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres
    networks:
      - vam-network
    profiles:
      - tools

# ==========================================
# Networks
# ==========================================
networks:
  vam-network:
    driver: bridge
    name: vam-network

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    name: vam-postgres-data
  redis_data:
    name: vam-redis-data
