spring:
  application:
    name: vam-service

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/vam_db
    username: vam_user
    password: ${DB_PASSWORD:vam_secure_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Disable Flyway for now (use JPA auto-create)
  flyway:
    enabled: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.bank.vam: DEBUG
    org.hibernate.SQL: DEBUG

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info
