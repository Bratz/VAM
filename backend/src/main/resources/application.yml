spring:
  application:
    # Aperture is the user-facing product brand; vam-service remains the
    # internal/operational name (logs, metrics, deployment artefacts).
    name: aperture-service

  # Database Configuration
  # All three connection coordinates are env-overridable. Override via:
  #   SPRING_DATASOURCE_URL=jdbc:postgresql://db.internal:5432/vam_db
  #   SPRING_DATASOURCE_USERNAME=app_user
  #   DB_PASSWORD=...        (kept as DB_PASSWORD for compatibility with
  #                           existing deploy scripts; SPRING_DATASOURCE_PASSWORD
  #                           also works via Spring Boot relaxed binding.)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vam_db}
    username: ${SPRING_DATASOURCE_USERNAME:vam_user}
    password: ${DB_PASSWORD:vam_user123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    # Off deliberately: with the schedulers below firing every 1-5 minutes
    # forever, echoing every statement (twice -- this AND org.hibernate.SQL)
    # wrote ~37GB to the OCI VM's stdout and filled its 45GB disk. See the
    # logging block for how to turn SQL logging back on for one run.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Batch JDBC inserts/updates for every entity (added Sprint-1 T7
        # for the forecast orchestrator's saveAll loop, but applies
        # globally — pure perf win, no behaviour change).
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true

  # Flyway owns what ddl-auto can't express: RLS policies, seed data,
  # backfills, one-off data repairs (see database/migrations/). It must
  # never redefine a column/table that an @Entity also maps — that stays on
  # ddl-auto below. Baseline is inclusive: existing DBs already have V2-V13's
  # effects (built by ddl-auto + historical hand-run psql), so baseline skips
  # those and only V14+ actually execute.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "13"   # quoted: avoid YAML int-parsing ambiguity

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# App-level config (not spring.*)
app:
  # Base URL of the deployed frontend -- used to build real, shareable links (e.g. the
  # public "pay this invoice" link) that point back at it.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

# Server
server:
  port: 8053

# ============================================================================
# VAM Application Configuration
# ============================================================================
vam:
  # Active market profile — switches default currency / country / locale / timezone
  # / base-rate type / weekend / home bank across the platform. One of
  # UAE | KSA | UK | EU | US | SG. Individual fields below can override.
  market:
    profile: ${VAM_MARKET_PROFILE:UAE}
    # default-currency, default-country-code, default-locale, default-timezone,
    # default-base-rate-type, weekend, home-bank-bic, home-bank-name,
    # iban-country-code, suggested-currencies — uncomment to override.
  # Home Bank — used to distinguish home-bank-held mirror VAs (pool-eligible)
  # from external-bank shadows (sweep sources only). Single system-wide config.
  #
  # Canonical bank identifier = the full SWIFT/BIC (e.g. EBILAEADXXX),
  # matching physical_accounts.bank_code / virtual_accounts.bank_swift.
  # Default = Emirates NBD (EBILAEADXXX) so the UAE demo lights up out of the
  # box; any other bank shows as External. For per-geography prospect demos,
  # boot with VAM_HOME_BANK_BIC = the home bank's full SWIFT:
  #   EU=DEUTDEFFXXX  KSA=RJHISARIXXX  UK=LOYDGB2LXXX
  #   US=CHASUS33XXX  AE=EBILAEADXXX  SG=SCBLSGSGXXX
  # NOTE: MarketProfile.homeBankBic is display-only (via /market-profile) and
  # uses truncated BICs — it is NOT the pool/activation home-bank check, which
  # reads HomeBankProperties (vam.home-bank.bic) only. Separate cleanup.
  #
  # Only the BIC is configured. The home-bank DISPLAY NAME is resolved from
  # the actual account data by this BIC (always consistent with the BIC);
  # there is intentionally no vam.home-bank.name — a static name field used
  # to render a stale wrong name when only the BIC was overridden for a
  # per-geography demo.
  home-bank:
    bic: ${VAM_HOME_BANK_BIC:EBILAEADXXX}
  # Multi-bank liquidity defaults
  multi-bank:
    # Default freshness threshold for shadow balance staleness checks
    default-freshness-threshold-minutes: 60
    # Scheduled refresh cadence for shadow balances (minutes)
    refresh-cadence-minutes: 15
  # Cash-forecast nightly scheduler (Sprint 1 / T8)
  # `enabled` gates the @Scheduled trigger bean — false ⇒ trigger never
  # registers (verifiable by log absence). On-demand runs via the T9
  # controller remain available regardless.
  forecast:
    schedule:
      enabled: ${VAM_FORECAST_SCHEDULE_ENABLED:true}
      # Spring cron: sec min hour day month weekday — 02:30 UTC daily.
      cron: ${VAM_FORECAST_SCHEDULE_CRON:0 30 2 * * *}
  # File-ingest pipeline — the "standard" upload/staging/processing lives here; an
  # unrecognized format files a ticket for the separate file-ingest-agent-service
  # worker (see tasks/file-ingest-pipeline-design.md's "Revised architecture").
  # workspace-dir and jira.* must match that worker's own config exactly — the
  # shared filesystem and Jira project are the only two things connecting them.
  fileingest:
    workspace-dir: ${VAM_FILEINGEST_WORKSPACE_DIR:/data/file-ingest-workspace}
    retry-cadence-minutes: ${VAM_FILEINGEST_RETRY_CADENCE_MINUTES:2}
    jira:
      base-url: ${JIRA_BASE_URL:https://vam-five.atlassian.net}
      email: ${JIRA_EMAIL:}
      api-token: ${JIRA_API_TOKEN:}
      project-key: ${JIRA_PROJECT_KEY:KAN}
  # Treasury Copilot — stub-only AI prototype (no LLM connection)
  ai:
    copilot:
      enabled: ${VAM_AI_COPILOT_ENABLED:true}
      # Delay between SSE token chunks. Drives the "live typing" illusion.
      stream-token-delay-ms: 30
      # TTL for unconfirmed action proposals (PauseSweepRule, SetBalanceAlert)
      action-proposal-ttl-minutes: 10
      conversation:
        # 0 = keep forever (prototype). Cleanup job comes before v1.
        retention-days: 0
        # Reserved for future LLM swap; stub treats each turn independently.
        message-history-window: 20
  # MCP server (Phase 1: no auth yet — vam.mcp.require-signed-context flips on in
  # Phase 3 once the gateway exists). Exposes the enquiry-only CopilotTool registry
  # over MCP protocol 2026-07-28 (stateless: no initialize handshake, no session).
  # See docs/mcp-architecture.md.
  mcp:
    enabled: ${VAM_MCP_ENABLED:false}
    protocol-version: "2026-07-28"
    # Set true once the gateway is actually deployed and reachable — until then
    # every caller runs with no corporate scope and no entitlement narrowing (same
    # as an in-app copilot call with no auth), so keep this disabled by default.
    # A *present* signed context is always verified regardless of this flag; it
    # only controls whether a call with none at all is rejected or let through
    # unscoped.
    require-signed-context: false
    # mcp-gateway's ContextJwksController — verifies the per-call signed context
    # minted by ContextJwtService there. Separate from any OAuth access-token JWKS.
    gateway-signed-context-jwks-uri: ${VAM_MCP_GATEWAY_JWKS_URI:http://localhost:9443/context-jwks}
    rate-limit:
      # Per-tool-name limiter (Phase 1: no caller identity to key on yet).
      # Phase 3 upgrades this to per-caller once the signed context exists.
      limit-for-period: 30
      limit-refresh-period-seconds: 60
      timeout-millis: 0

# ============================================================================
# LOGGING CONFIGURATION - File + Console
# ============================================================================
logging:
  # Log file location
  file:
    name: logs/vam-service.log
  
  # Log file rotation settings
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 100MB
  
  # Log patterns
  pattern:
    console: "%d{HH:mm:ss.SSS} %clr(%-5level) %clr([%15.15thread]){faint} %clr(%-40.40logger{39}){cyan} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} : %msg%n"
  
  # Log levels by package.
  #
  # Production-quiet by default, debug opt-in. This used to run at DEBUG/TRACE
  # everywhere, which is fine for a few minutes on a laptop and ruinous for a
  # long-running deployment: BasicBinder at TRACE logs every bind parameter of
  # every query, and the @Scheduled sweeps (every 1, 2 and 5 minutes, forever)
  # each scan hundreds of accounts. That filled the OCI VM's 45GB disk and broke
  # every build until the logs were truncated.
  #
  # To get SQL and parameters back for one run:
  #   mvn spring-boot:run "-Dspring-boot.run.jvmArguments=-Dspring.jpa.show-sql=true -Dlogging.level.org.hibernate.SQL=DEBUG -Dlogging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE"
  # Or for one package: -Dlogging.level.com.bank.vam.service.treasury=DEBUG
  level:
    # Root level
    root: INFO
    
    # Spring Framework
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.transaction: WARN
    org.springframework.orm.jpa: WARN
    
    # Hibernate — quiet. org.hibernate alone is not enough: a level set on a
    # child logger here wins over its parent, so each noisy one needs naming.
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.engine.transaction: WARN
    
    # Application packages. One entry — the five sub-package lines that used to
    # follow all inherited this same level anyway.
    com.bank.vam: INFO

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Sentry error monitoring — SDK auto-disables itself when dsn is blank, so this
# is a safe no-op until SENTRY_DSN is actually set (see deploy/oci/docker-compose.yml).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0  # error capture only — no perf tracing needed yet

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info