# Test profile — used by integration tests under src/test/java.
#
# DB URL is set dynamically by each @Testcontainers test via
# @DynamicPropertySource (see ForecastOrchestratorIT). We keep the JPA / Flyway
# settings here so they don't need to be wired in every test class.
spring:
  jpa:
    hibernate:
      # ddl-auto=update so Hibernate creates the schema in the test container
      # (Flyway stays OFF in test too — same as prod-dev — so the canonical
      # category seed in V13 does NOT run automatically; tests that need
      # categories seed them manually in @BeforeEach.)
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: false

# Quiet down the noisier loggers so test output stays readable.
logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework: WARN
    com.bank.vam.forecast: DEBUG
